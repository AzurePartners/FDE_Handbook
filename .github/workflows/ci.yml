name: CI

on:
  pull_request:
  push:
    branches: [main, drafts]
  workflow_dispatch: # started by the Translate workflow after it commits translations

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, for each page's "Last updated" date
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Content checks
        run: npm run check -- --verbose
      - name: Build site
        run: npm run build
