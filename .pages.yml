# Pages CMS (https://app.pagescms.org) configuration: the editing dashboard for this repo.
# Sign in with GitHub, open this repository, and pick the `drafts` branch in the branch menu.
# Every save is a commit on that branch; see CONTRIBUTING.md for how drafts are published.

media:
  input: public/images
  output: /images

content:
  - name: english
    label: English
    type: group
    items:
      - name: en-m0
        label: "M0 · Start Here: Understanding the FDE Role"
        type: collection
        path: src/content/docs/m0
        subfolders: true
        filename: "{primary}.md"
        view:
          layout: tree
          primary: title
          fields: [title, row]
        fields: &page-fields
          - name: title
            label: Title
            type: string
            required: true
          - name: row
            label: Syllabus Row ID
            description: The Master Syllabus row this page covers, e.g. M4-L1.2. Leave empty for introductions.
            type: string
            pattern:
              regex: "^(M\\d-L\\d+\\.\\d+)?$"
              message: "Row IDs look like M4-L1.2"
          - name: rows
            label: All syllabus rows (only for pages covering several rows)
            type: string
            list: true
          - name: body
            label: Page content (Markdown)
            description: "Write Markdown. Link to another page by its file path, e.g. ../02-lesson/03-page.md"
            type: code
            options:
              format: markdown
      - name: en-m1
        label: "M1 · AI-Assisted Development & Software Systems Foundations"
        type: collection
        path: src/content/docs/m1
        subfolders: true
        filename: "{primary}.md"
        view:
          layout: tree
          primary: title
          fields: [title, row]
        fields: *page-fields
      - name: en-m2
        label: "M2 · AI Application Engineering"
