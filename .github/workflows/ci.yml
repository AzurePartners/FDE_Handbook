name: CI

on:
  pull_request:
  push:
    branches: [main, drafts]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the "translation older than English page" check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Content checks
        run: npm run check -- --verbose
      - name: Build site
        run: npm run build
