# Dashboard (Pages CMS) edits are saved to the `drafts` branch. This workflow
#  - keeps one "Publish dashboard edits" pull request open from drafts into main, and
#  - merges main back into drafts after every change to main, so drafts never falls behind.
name: Drafts

on:
  push:
    branches: [main, drafts]

permissions:
  contents: write
  pull-requests: write

concurrency: drafts

jobs:
  open-publish-pr:
    if: github.ref == 'refs/heads/drafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.pulls.list({ owner, repo, head: `${owner}:drafts`, base: 'main', state: 'open' });
            if (open.data.length) {
              core.info(`Publish PR already open: ${open.data[0].html_url}`);
              return;
            }
            const { data: cmp } = await github.rest.repos.compareCommits({ owner, repo, base: 'main', head: 'drafts' });
            if (!cmp.files?.length) {
              core.info('drafts has no changes compared with main.');
              return;
            }
            const title = 'Publish dashboard edits';
            const body = [
              'Edits saved in the dashboard (Pages CMS) since the last publish.',
              '',
              '- Review the changes in **Files changed** and on the Vercel preview of the `drafts` branch.',
              '- When CI is green, merge with **Create a merge commit** to publish them to the live site.',
              '',
              'This pull request updates itself as more edits are saved.',
            ].join('\n');
            try {
              const { data: pr } = await github.rest.pulls.create({ owner, repo, head: 'drafts', base: 'main', title, body });
              core.info(`Opened ${pr.html_url}`);
            } catch (e) {
              if (e.status !== 403) throw e;
              // The repository (or organization) does not let workflows open pull requests. Saving
              // still worked; point the editor at a one-click link instead of failing the run.
              const url = `${context.serverUrl}/${owner}/${repo}/compare/main...drafts?expand=1&title=${encodeURIComponent(title)}`;
              core.warning(
                `Your edit is saved on the drafts branch, but GitHub did not let this workflow open the publish pull request. ` +
                `Open it yourself: ${url} . To let it open automatically, turn on "Allow GitHub Actions to create and approve pull requests" ` +
                `under Settings → Actions → General → Workflow permissions (in the organization's settings first, then the repository's).`,
              );
              await core.summary
                .addHeading('Edit saved: open the publish pull request')
                .addRaw('GitHub did not let this workflow open the pull request, so ')
                .addLink('open it here', url)
                .addRaw('.')
                .addBreak()
                .addRaw('To have it opened automatically after every save, turn on <b>Allow GitHub Actions to create and approve pull requests</b> under <b>Settings → Actions → General → Workflow permissions</b>, in the organization settings and then the repository settings.')
                .write();
            }

  sync-drafts-with-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge main into drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin drafts >/dev/null; then
            git push origin HEAD:refs/heads/drafts
            exit 0
          fi
          git checkout -B drafts origin/drafts
          if ! git merge --no-edit origin/main; then
            echo "::error::drafts and main changed the same lines. Merge main into drafts by hand and resolve the conflict."
            exit 1
          fi
          git push origin drafts
