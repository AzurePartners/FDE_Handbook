  - name: modules
    label: Modules & lessons (sidebar labels, hours)
    type: file
    path: src/data/modules.json
    format: json
    fields:
      - name: modules
        label: Modules
        type: object
        list: true
        fields:
          - { name: code, label: Code, type: string, required: true }
          - { name: dir, label: Folder, type: string, required: true }
          - { name: name, label: Name, type: string, required: true }
          - { name: name_zh, label: Name (中文), type: string }
          - { name: minHours, label: Minimum hours, type: number }
          - { name: maxHours, label: Maximum hours, type: number }
          - { name: purpose, label: Purpose, type: text }
          - name: lessons
            label: Lessons (one per folder, in order)
            type: object
            list: true
            fields:
              - { name: dir, label: Folder, type: string, required: true }
              - { name: label, label: Label, type: string, required: true }
              - { name: label_zh, label: Label (中文), type: string }
